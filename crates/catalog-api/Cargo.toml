[package]
name = "catalog-api"
description = "The catalog's ONLY interface: /api/catalog/* over the EHDB-backed store. No SQL surface of any kind."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "catalog-server"
path = "src/main.rs"

[dependencies]
catalog-ingest = { workspace = true }
catalog-model = { workspace = true }
catalog-store = { workspace = true }
# Matching noetl/server's versions, so a handler moved between them does not need
# rewriting and a scrape renders identically.
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
