[workspace]
members = [
  "crates/catalog-extract",
  "crates/catalog-ingest",
  "crates/catalog-model",
  "crates/catalog-store",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/noetl/catalog"
rust-version = "1.99.0"

[workspace.dependencies]
# Kept deliberately small on commit one. The EHDB persistence dependency is
# added in the commit that introduces the store boundary, not before — an
# unused dependency in a workspace is a claim the code does not yet support.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# EHDB is the storage backend — the catalog is the model and API over it.
# ⚠ Both pins MUST move together: they share `ehdb-l0`, and two tags put two
# `ehdb-l0` versions in one dependency graph. noetl/server's own Cargo.toml
# records that as a real incident.
# ⚠ NOT `ehdb-reference` — that is the older parallel lineage, is not what the
# server links, and its election/fencing self-describe as non-authoritative.
ehdb-l0 = { git = "https://github.com/noetl/ehdb", tag = "v0.4.5" }
ehdb-core = { git = "https://github.com/noetl/ehdb", tag = "v0.4.5" }
catalog-extract = { path = "crates/catalog-extract" }
catalog-model = { path = "crates/catalog-model" }
catalog-store = { path = "crates/catalog-store" }

# The playbook source is YAML. 0.9 is what noetl/server parses registration with, so
# the extractor and the registrar agree about what a document means — a second YAML
# implementation would be a second opinion on the thing being catalogued.
serde_yaml = "0.9"

# The fleet's metrics crate, at the version noetl/server pins, so a scrape from this
# crate and from the server render identically.
#
# ⚠⚠ `Registry::gather` PRUNES metric families with no children (prometheus
# `registry.rs`), so a labelled metric is ABSENT until something increments it —
# registering it is not enough. A missing series then looks the same as a healthy
# zero, a broken exporter, and a binary too old to carry the metric. Every closed
# label set in this crate is therefore pinned at 0 UNCONDITIONALLY; see
# `catalog_store::metrics`.
prometheus = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# These are denied in CI via `-D warnings`; declaring them here means a local
# `cargo clippy` reproduces CI rather than disagreeing with it.
all = { level = "warn", priority = -1 }
