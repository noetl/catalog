name: CI

# A real gate from commit one.
#
# `noetl/ai-meta` ran with ZERO CI for its whole life, and five NoETL repos ran
# `cargo clippy ... || true`, which cannot fail and therefore gates nothing.
# Both are recorded in noetl/ai-meta#374. This file is written so that neither
# shape is possible here: every step either passes or fails the job, and none of
# them is suffixed with `|| true`.
#
# Shape copied from noetl/ehdb's ci.yml, which is the one repo in the fleet whose
# clippy step is a genuine `-D warnings` gate.
#
# ⚠ `rust` is a REQUIRED status check on `main`. Two consequences, both learned here:
#   * A bot commit that carries `[skip ci]` can never be pushed to `main`, because the
#     required check never RUNS on it and stays "expected" forever (GH006). That is why
#     semantic-release has no `@semantic-release/git` plugin.
#   * A PR with no run at all is BLOCKED rather than failing, which looks like a review
#     problem rather than a CI problem. If a PR shows zero checks, the workflow did not
#     trigger — look there first, not at branch protection.

on:
  pull_request:
  push:
    branches:
      - main

# A second push to the same PR should cancel the first; a stale green on an old
# commit is one of the ways "CI is green" has been misread in this fleet.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `toolchain:` argument: rust-toolchain.toml pins 1.99.0 and rustup
      # honours it. Naming a version here as well would create two authorities
      # that can disagree — the same class of bug as the 2026-08-03 version
      # regression in noetl/server.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Report the toolchain actually in use
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Formatting
        run: cargo fmt --all --check

      # Runs before the full suite because it is the check a developer's machine
      # structurally cannot make (an untracked source file is present locally).
      # Named separately so the failure is legible instead of surfacing as an
      # unrelated compile error inside a long test run.
      - name: Source hygiene (every .rs on disk is git-tracked)
        run: cargo test -p catalog-model --test workspace_target_hygiene -- --nocapture

      - name: Tests
        run: cargo test --workspace --all-targets

      # `--all-targets` so tests and benches are linted too. `-D warnings` with
      # NO `|| true`: this step is allowed to fail the build, which is the whole
      # point of having it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ⚠ The image build is a GATE, not a release-time surprise.
  #
  # Before this job the crate had no Dockerfile at all, so "it runs nowhere" was invisible
  # to a green CI. Building on every PR means a Dockerfile that cannot build fails here
  # rather than at tag time, when the fix costs a release cycle.
  #
  # Nothing is pushed: `push: false` and `load: true`, so this proves the build AND runs
  # the resulting image. A build-only check would pass for an image that cannot start —
  # which is the "exists but does not work" shape this repo keeps finding.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (amd64 only here; release builds both natively)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: catalog-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The binary in the image must be real
        run: |
          set -euo pipefail
          # A dependency-cache layer builds dummy sources. If the real build were skipped
          # the image would still start and serve nothing, so assert the artifact's size
          # and that it carries the route strings.
          SZ=$(docker run --rm --entrypoint /bin/sh catalog-server:ci -c 'stat -c %s /app/catalog-server')
          echo "binary bytes: $SZ"
          test "$SZ" -gt 1000000
          docker run --rm --entrypoint /bin/sh catalog-server:ci \
            -c 'strings /app/catalog-server | grep -q "api/catalog"'

      - name: The container must actually SERVE /api/catalog/*
        run: |
          set -euo pipefail
          docker volume create catdata >/dev/null
          docker run -d --name cat -p 8091:8091 \
            -e NOETL_INTERNAL_API_TOKEN=ci-token \
            -v catdata:/data/catalog catalog-server:ci
          # Poll, with a bounded wait and a loud failure. `curl` is in the image on
          # purpose — a container whose health cannot be probed from inside is a
          # container whose health is unknowable.
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8091/api/catalog/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS --max-time 10 http://127.0.0.1:8091/api/catalog/health
          echo
          # A real write + read through the image, not just a health 200: a token-guarded
          # POST, then the reverse index that write should appear in.
          curl -fsS -X POST http://127.0.0.1:8091/api/catalog/types \
            -H 'content-type: application/json' -H 'authorization: Bearer ci-token' \
            -d '{"name":"playbook"}' >/dev/null
          curl -fsS -X POST http://127.0.0.1:8091/api/catalog/objects \
            -H 'content-type: application/json' -H 'authorization: Bearer ci-token' \
            -d '{"resource_type":"playbook","path":"ci/probe"}' >/dev/null
          curl -fsS -X POST http://127.0.0.1:8091/api/catalog/attributes \
            -H 'content-type: application/json' -H 'authorization: Bearer ci-token' \
            -d '{"path":"ci/probe","name":"uses_credential.ci","value":{"type":"flag"}}' >/dev/null
          GOT=$(curl -fsS "http://127.0.0.1:8091/api/catalog/by-attribute?name=uses_credential.ci")
          echo "reverse index: $GOT"
          echo "$GOT" | grep -q 'ci/probe'
          # And an unauthenticated write must be refused, in the image, not just in tests.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8091/api/catalog/types \
            -H 'content-type: application/json' -d '{"name":"nope"}')
          echo "unauthenticated write: $CODE"
          test "$CODE" = "403" || test "$CODE" = "401" || test "$CODE" = "503"
          docker logs cat | tail -5
          docker rm -f cat >/dev/null
